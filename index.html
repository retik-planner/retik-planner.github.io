<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <!-- Replaced by `flutter build web --base-href`; must start and end with "/". -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="ریتیک (Retik)، برنامه‌ریز روزانه و عادت‌ساز فارسی با تقویم شمسی: عادت‌ها، کارهای روزانه، استریک، ثبت حال و بودجه. رایگان، بدون اینترنت و بدون ثبت‌نام.">
  <link rel="canonical" href="https://retik-planner.github.io/">

  <!-- How the link looks when shared in Telegram, WhatsApp and others. -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://retik-planner.github.io/">
  <meta property="og:title" content="ریتیک | Retik: روزت رو تیک بزن">
  <meta property="og:description" content="برنامه‌ریز روزانه و عادت‌ساز فارسی با تقویم شمسی. رایگان و بدون اینترنت.">
  <meta property="og:image" content="https://retik-planner.github.io/icons/Icon-512.png">
  <meta property="og:locale" content="fa_IR">
  <meta name="theme-color" content="#16181A">

  <!-- iOS: «Add to Home Screen» opens it full screen like an app. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Retik">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ریتیک | Retik: برنامه‌ریز روزانه و عادت‌ساز فارسی با تقویم شمسی</title>
  <link rel="manifest" href="manifest.json">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "ریتیک (Retik)",
    "alternateName": ["Retik", "ریتیک"],
    "url": "https://retik-planner.github.io/",
    "applicationCategory": "LifestyleApplication",
    "operatingSystem": "Android, Web",
    "inLanguage": ["fa", "en"],
    "description": "برنامه‌ریز روزانه و عادت‌ساز فارسی با تقویم شمسی، بدون اینترنت.",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "IRR" }
  }
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #16181A; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      color: #9A988F; font: 14px system-ui, sans-serif;
    }
    #splash img { width: 96px; height: 96px; border-radius: 22px; }
    #splash h1 { margin: 0; font-size: 20px; font-weight: 500; color: #E8E6DF; }
    #splash p { margin: 0; max-width: 420px; padding: 0 24px; text-align: center; line-height: 1.8; }
  </style>
</head>
<body>
  <!-- Shown until Flutter draws its first frame; the engine is a few MB on the first visit. -->
  <div id="splash">
    <img src="icons/Icon-192.png" alt="ریتیک">
    <!-- Plain text for search engines: the app itself is drawn on a canvas they can't read. -->
    <h1>ریتیک | Retik</h1>
    <p>برنامه‌ریز روزانه و عادت‌ساز فارسی با تقویم شمسی: عادت‌ها، کارهای روزانه، استریک، ثبت حال و بودجه. رایگان، بدون اینترنت و بدون ثبت‌نام.</p>
    <div>ریتیک داره باز می‌شه…</div>
  </div>
  <script>
    // Ask the browser not to clear Retik's data when space runs low or the site isn't
    // opened for a while (Safari does this otherwise). Browsers may say no; backups still help.
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) s.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
