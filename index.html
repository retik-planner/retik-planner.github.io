<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <!-- Replaced by `flutter build web --base-href`; must start and end with "/". -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="ریتیک: روزت رو تیک بزن. عادت‌ها، کارها، حال و بودجه، بدون اینترنت.">
  <meta name="theme-color" content="#16181A">

  <!-- iOS: «Add to Home Screen» opens it full screen like an app. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Retik">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Retik | ریتیک</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #16181A; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      color: #9A988F; font: 14px system-ui, sans-serif;
    }
    #splash img { width: 96px; height: 96px; border-radius: 22px; }
  </style>
</head>
<body>
  <!-- Shown until Flutter draws its first frame; the engine is a few MB on the first visit. -->
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <div>ریتیک داره باز می‌شه…</div>
  </div>
  <script>
    // Ask the browser not to clear Retik's data when space runs low or the site isn't
    // opened for a while (Safari does this otherwise). Browsers may say no; backups still help.
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) s.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
